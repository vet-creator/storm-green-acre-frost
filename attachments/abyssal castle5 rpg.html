/* --- B4 : hidden metric. Reveal pairwise distances (budgeted); find the
       minimum-weight Hamiltonian path over nine stones. --- */
ROOM_UI.B4=(room,inst,onWin)=>{
  const N=inst.N, D=inst.D;
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  /* nine stones on a ring; tap two to reveal their distance */
  const R=120, cx=150, cy=150;
  const node=k=>{ const a=(k/N*360-90)*Math.PI/180; return [cx+R*Math.cos(a),cy+R*Math.sin(a)]; };
  const svg=el('svg',{width:300,height:300,viewBox:'0 0 300 300'});
  const known=new Map(); /* "i,j" -> w */
  const tbl=el('div',{style:'display:grid;grid-template-columns:repeat(10,26px);gap:1px;font-size:11px;text-align:center'});
  let sel=[];
  const edgeLayer=el('g',{}); svg.append(edgeLayer);
  const nodeLayer=el('g',{}); svg.append(nodeLayer);
  const path=[]; /* player's chosen tour as node sequence */
  const redraw=()=>{
    edgeLayer.innerHTML=''; nodeLayer.innerHTML='';
    /* every reading, tabulated (36 edges would blur on the ring) */
    tbl.innerHTML=''; tbl.append(el('div',{},''));
    for(let c=0;c<N;c++) tbl.append(el('div',{style:'color:var(--golddim)'},String(c)));
    for(let r=0;r<N;r++){
      tbl.append(el('div',{style:'color:var(--golddim)'},String(r)));
      for(let c=0;c<N;c++){ const w=known.get(Math.min(r,c)+','+Math.max(r,c));
        tbl.append(el('div',{style:'height:18px;line-height:18px;border:1px solid var(--line2);color:var(--phos)'},(r===c||w===undefined)?'':String(w))); }
    }
    /* known edges faint */
    for(const [k,w] of known){
      const [i,j]=k.split(',').map(Number);
      const [x1,y1]=node(i), [x2,y2]=node(j);
      edgeLayer.append(el('line',{x1,y1,x2,y2,stroke:'var(--line2)','stroke-width':1}));
      edgeLayer.append(el('text',{x:(x1+x2)/2,y:(y1+y2)/2,fill:'var(--phosdim)','font-size':11,'text-anchor':'middle'},String(w)));
    }
    /* player's path edges bold gold */
    for(let i=1;i<path.length;i++){
      const [x1,y1]=node(path[i-1]), [x2,y2]=node(path[i]);
      edgeLayer.append(el('line',{x1,y1,x2,y2,stroke:'var(--gold)','stroke-width':2.6,
        style:'filter:drop-shadow(0 0 3px rgba(216,179,106,.6))'}));
    }
    for(let k=0;k<N;k++){
      const [x,y]=node(k);
      const inPath=path.includes(k), isSel=sel.includes(k);
      const seq=path.indexOf(k);
      nodeLayer.append(el('circle',{cx:x,cy:y,r:13,
        fill: inPath?'#171208': isSel?'var(--stone2)':'var(--stone)',
        stroke: inPath?'var(--gold)': isSel?'var(--phos)':'var(--phosdim)','stroke-width':inPath?2:1.4,
        style:'cursor:pointer',
        onclick:()=>tapNode(k)}));
      nodeLayer.append(el('text',{x,y:y+4,fill:inPath?'var(--gold)':'var(--phos)','font-size':13,'text-anchor':'middle','pointer-events':'none'},
        inPath?String(seq+1):String(k)));
    }
  };
  let mode='probe'; /* 'probe' reveals distances, 'route' builds the path */
  const tapNode=k=>{
    if(mode==='probe'){
      AU.tick();
      if(sel.includes(k)) sel=sel.filter(v=>v!==k);
      else sel.push(k);
      if(sel.length===2){
        const [i,j]=sel.slice().sort((a,b)=>a-b);
        const key=i+','+j;
        if(!known.has(key)){
          if(used>=tot){ bad(svg); sel=[]; redraw(); return; }
          used++; updBudget(bud,used,tot);
          known.set(key,D[i][j]); AU.probe();
        }
        sel=[];
      }
      redraw();
    } else {
      AU.tick();
      const at=path.indexOf(k);
      if(at===path.length-1){ path.pop(); }         /* undo last */
      else if(at===-1){ path.push(k); }             /* extend */
      redraw();
    }
  };
  const modeBtn=el('button',{cls:'key',style:'width:auto;padding:8px 16px;height:auto',onclick:()=>{
    mode = mode==='probe'?'route':'probe'; sel=[]; AU.blip(); modeLbl.textContent=mode==='probe'?'◎':'⟿'; redraw();
  }});
  const modeLbl=el('div',{style:'color:var(--phos)'},'◎'); modeBtn.append(modeLbl);
  redraw();
  const wsum=el('div',{style:'font-size:15px;color:var(--phosdim)'},'');
  const updSum=()=>{ let w=0,valid=path.length===N&&new Set(path).size===N;
    for(let i=1;i<path.length;i++){ const a=Math.min(path[i-1],path[i]),b=Math.max(path[i-1],path[i]);
      const kk=known.get(a+','+b); if(kk===undefined){valid=false;} else w+=kk; }
    wsum.textContent = path.length===N ? ('Σ '+(valid?w:'?')) : (path.length+' / '+N); };
  const iv=setInterval(()=>{ if(S.view!=='B4'){clearInterval(iv);return;} updSum(); },200);
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'color:var(--golddim);font-size:13px'},''),wsum);
  room.append(bud,el('div',{style:'color:var(--phosdim);font-size:13px'},''),
    svg,el('div',{cls:'btnrow'},modeBtn,resetBtn(()=>{path.length=0;sel=[];redraw();})),tbl,chal,
    el('div',{cls:'btnrow'},submitBtn(()=>{
      if(path.length!==N||new Set(path).size!==N){ bad(chal); return; }
      let w=0; for(let i=1;i<path.length;i++) w+=D[path[i-1]][path[i]];
      if(w===inst.best) onWin(); else wrongSeal(chal);
    })));
};

/* --- B5 : the heap duel. Find the unique balancing move, then hold the
       invariant until the castle has no stones left. --- */
ROOM_UI.B5=(room,inst,onWin)=>{
  let piles=inst.piles.slice();
  const rng=mulberry32((Date.now()^0x5EED)>>>0);
  let turn='you';
  const box=el('div',{cls:'labbox'});
  const info=el('div',{style:'color:var(--phosdim);font-size:14px'},'');
  const board=el('div',{style:'display:flex;gap:20px;align-items:flex-end;justify-content:center'});
  let selPile=-1, selCount=0;
  const draw=()=>{
    board.innerHTML='';
    piles.forEach((p,i)=>{
      const col=el('div',{style:'display:flex;flex-direction:column-reverse;gap:3px;align-items:center;cursor:pointer'});
      for(let s=0;s<p;s++){
        const taken = i===selPile && s>=p-selCount;
        col.append(el('div',{style:`width:30px;height:14px;background:${taken?'var(--seal)':'var(--gold)'};
          opacity:${taken?.5:1};border-radius:2px`}));
      }
      col.addEventListener('click',()=>{
        if(turn!=='you')return; AU.tick();
        if(selPile!==i){ selPile=i; selCount=1; }
        else { selCount = selCount>=p ? 1 : selCount+1; }
        draw();
      });
      const wrap=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:6px'});
      wrap.append(col,el('div',{style:'font-size:13px;color:var(--phosdim)'},String(p)));
      board.append(wrap);
    });
  };
  draw();
  const takeBtn=submitBtn(()=>{
    if(turn!=='you'||selPile<0||selCount<1){ bad(box); return; }
    piles[selPile]-=selCount; AU.blip(); selPile=-1;selCount=0;
    if(piles.every(p=>p===0)){ /* you took the last stone => you win under normal play */
      draw(); onWin(); return; }
    turn='castle'; draw(); info.textContent='…';
    setTimeout(()=>{
      if(S.view!=='B5') return;
      const mv=nimAiReply(piles,rng);
      if(mv){ piles[mv[0]]-=mv[1]; }
      AU.probe();
      if(piles.every(p=>p===0)){ draw(); info.textContent='✕'; wrongSeal(box); return; }
      turn='you'; draw(); info.textContent='';
    },900);
  });
  box.append(info,board,el('div',{cls:'btnrow'},resetBtn(()=>{piles=inst.piles.slice();selPile=-1;selCount=0;turn='you';draw();info.textContent='';}),takeBtn));
  room.append(box);
};

/* --- B6 : hidden linear code. Infer the parity checks from the codeword
       lattice, correct one error in each of three words, read the datum. --- */
ROOM_UI.B6=(room,inst,onWin)=>{
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},''));
  /* show a handful of genuine codewords so the player can deduce H */
  const study=el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;justify-content:center'});
  const shown=inst.shown;
  shown.forEach(cw=>{
    const row=el('div',{style:'display:flex;gap:2px'});
    for(let b=6;b>=0;b--) row.append(el('div',{style:`width:16px;height:20px;border:1px solid var(--line2);
      background:${(cw>>b)&1?'var(--phos)':'var(--stone)'}`}));
    study.append(el('div',{style:'padding:4px;border:1px solid var(--line2)'},row));
  });
  box.append(study);
  /* three received words, each editable; player flips the erroneous bit */
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'color:var(--golddim);font-size:13px'},''));
  const fixed=inst.words.map(w=>w.rx);
  const wordRows=[];
  inst.words.forEach((w,wi)=>{
    const rowWrap=el('div',{style:'display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--line2)'});
    const bitsWrap=el('div',{style:'display:flex;gap:3px'});
    const drawBits=()=>{
      bitsWrap.innerHTML='';
      for(let b=6;b>=0;b--){
        const on=(fixed[wi]>>b)&1;
        const cell=el('div',{style:`width:24px;height:30px;border:1px solid var(--phosdim);border-radius:3px;cursor:pointer;
          background:${on?'var(--phos)':'var(--stone)'}`});
        cell.addEventListener('click',()=>{ AU.tick(); fixed[wi]^=(1<<b); drawBits(); mark(); });
        bitsWrap.append(cell);
      }
    };
    const status=el('div',{style:'font-size:16px;width:24px;text-align:center'},'');
    const mark=()=>{};   /* no live codeword check: H must be inferred, not brute-forced */
    drawBits(); mark();
    rowWrap.append(bitsWrap,status);
    wordRows.push({get:()=>fixed[wi]});
    chal.append(rowWrap);
  });
  room.append(box,chal,el('div',{cls:'btnrow'},submitBtn(()=>{
    /* all three must be codewords AND each within distance 1 of its received word */
    let ok=true;
    inst.words.forEach((w,wi)=>{
      for(const h of inst.H) if(pc8(h&fixed[wi])&1) ok=false;
      if(pc8(fixed[wi]^w.rx)!==1) ok=false;
    });
    if(ok) onWin(); else wrongSeal(chal);
  })));
};

/* --- K2 : the machine forge over a hidden operation. Probe f, identify it,
       then program the register machine. Verified by exhaustive testing. --- */
ROOM_UI.K2=(room,inst,onWin)=>{
  /* show the observable probe table */
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},'⊛'));
  const tbl=el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;justify-content:center'});
  inst.shown.forEach(([a,b,v])=>tbl.append(
    el('div',{style:'padding:6px 10px;border:1px solid var(--line2);font-size:15px;color:var(--ink)'},`${a} ⊛ ${b} = ${v}`)));
  box.append(tbl);
  /* a small free probe so the player can test more (a,b) */
  let pa=3,pb=4;
  const fam=REF_FAMS[inst.famKey];
  const pv=el('div',{style:'font-size:20px;color:var(--gold);min-width:50px;text-align:center'},'·');
  const stp=(get,set,lbl)=>el('div',{style:'display:flex;flex-direction:column;gap:2px;align-items:center'},
    el('button',{cls:'key',style:'width:34px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(1);probe.textContent='·';rr();}},'＋'),
    el('div',{style:'width:40px;height:34px;border:1px solid var(--phosdim);display:flex;align-items:center;justify-content:center;color:var(--phos)'},String(get())),
    el('button',{cls:'key',style:'width:34px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(-1);probe.textContent='·';rr();}},'−'));
  let saStep,sbStep;
  const probeRow=el('div',{style:'display:flex;gap:10px;align-items:center'});
  const rr=()=>{ probeRow.innerHTML='';
    saStep=stp(()=>pa,d=>pa=Math.max(0,Math.min(10,pa+d)));
    sbStep=stp(()=>pb,d=>pb=Math.max(0,Math.min(10,pb+d)));
    probeRow.append(saStep,el('div',{style:'color:var(--line)'},'⊛'),sbStep,
      el('div',{style:'color:var(--line)'},'='),pv,
      probeBtn(()=>{ AU.probe(); pv.textContent=String(fam.f(pa,pb)); }));
  };
  const probe=el('div');
  rr();
  box.append(probeRow);
  /* SEAL: compute the operation's output on three hidden input-pairs.
     identifying ⊛ from the bench is the intellectual content; the three
     numbers cannot be guessed (~10^6 joint space). */
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'color:var(--golddim);font-size:13px'},'⊛'));
  const bufs=['','',''];
  let active=0;
  const slotEls=[];
  const slotWrap=el('div',{style:'display:flex;flex-direction:column;gap:8px'});
  inst.sealPairs.forEach((pr,i)=>{
    const row=el('div',{style:'display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px'});
    const lbl=el('div',{style:'font-size:18px;color:var(--phos)'},pr[0]+' ⊛ '+pr[1]+' =');
    const disp=el('div',{style:`min-width:70px;height:40px;border-bottom:2px solid var(--phosdim);
      display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold)`},'·');
    row.append(lbl,disp);
    row.addEventListener('click',()=>{ AU.tick(); active=i; paintSlots(); });
    slotEls.push({disp,row}); slotWrap.append(row);
  });
  const paintSlots=()=>{ slotEls.forEach((s,i)=>{
    s.disp.textContent = bufs[i]||'·';
    s.row.style.background = i===active?'var(--stone)':'transparent';
    s.disp.style.borderColor = i===active?'var(--gold)':'var(--phosdim)';
  }); };
  paintSlots();
  const pad=digitPad(d=>{ if(bufs[active].length<4){ bufs[active]+=d; paintSlots(); } },
    ()=>{ bufs[active]=bufs[active].slice(0,-1); paintSlots(); });
  chal.append(slotWrap);
  room.append(box,chal,pad,el('div',{cls:'btnrow'},
    resetBtn(()=>{ bufs[0]=bufs[1]=bufs[2]=''; active=0; paintSlots(); }),
    submitBtn(()=>{
      if(bufs.every((b,i)=>b!=='' && Number(b)===inst.sealPairs[i][2])) onWin();
      else wrongSeal(chal);
    })));
};

/* --- K3 : hidden group by its multiplication oracle. Chase orbits (budgeted);
       find the ORDER of the marked element — engineered beyond the budget so
       Lagrange's theorem must close the gap. --- */
ROOM_UI.K3=(room,inst,onWin)=>{
  const n=inst.n, tab=inst.mulTab, e=inst.e, g=inst.marked;
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},'●  ★'));
  /* the multiplication bench: pick A, B, see A·B index. */
  let A=g,B=g;
  const chip=(lbl,get,set,star)=>{
    const r=el('div',{style:'display:flex;flex-direction:column;gap:2px;align-items:center'});
    r.append(el('button',{cls:'key',style:'width:36px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(1);rc();}},'＋'));
    const d=el('div',{style:'width:52px;height:40px;border:1px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--phos);position:relative'});
    d.textContent = get()===e?'●':(get()===g?'★':String(get()));
    r.append(d);
    r.append(el('button',{cls:'key',style:'width:36px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(-1);rc();}},'−'));
    return r;
  };
  const out=el('div',{style:'font-size:20px;color:var(--gold);min-width:52px;text-align:center'},'·');
  const orbitBox=el('div',{cls:'logbox',style:'max-height:90px'});
  const orbit=[];
  const relorb=()=>{ orbitBox.innerHTML=''; if(!orbit.length){orbitBox.append(el('div',{style:'color:var(--line);font-size:12px'},'★, ★², …'));return;}
    const row=el('div',{style:'display:flex;gap:4px;flex-wrap:wrap;justify-content:center'});
    orbit.forEach((v,i)=>row.append(el('div',{style:`width:30px;height:24px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;
      color:${v===e?'var(--gold)':'var(--phos)'}`},v===e?'●':(v===g?'★':String(v)))));
    orbitBox.append(row);
  };
  const rc=()=>{ mrow.innerHTML='';
    const ca=chip('A',()=>A,d=>A=((A+d)%n+n)%n);
    const cb=chip('B',()=>B,d=>B=((B+d)%n+n)%n);
    mrow.append(ca,el('div',{style:'color:var(--line)'},'·'),cb,el('div',{style:'color:var(--line)'},'='),out,
      probeBtn(()=>{
        if(used>=tot){ bad(box); return; }
        used++; updBudget(bud,used,tot);
        AU.probe(); const p=tab[A][B]; out.textContent = p===e?'●':(p===g?'★':String(p));
      }));
  };
  const mrow=el('div',{style:'display:flex;gap:10px;align-items:center'}); rc();
  /* a convenience: chase ★ one power at a time (also budgeted) */
  const chaseBtn=el('button',{cls:'sigilbtn small',onclick:()=>{
    if(used>=tot){ bad(box); return; }
    used++; updBudget(bud,used,tot);
    AU.probe();
    const last = orbit.length? orbit[orbit.length-1] : e;
    const nextEl = orbit.length? tab[last][g] : g;
    orbit.push(nextEl); relorb();
  }},el('div',{style:'font-size:12px;color:var(--phos)'},'★ⁿ'));
  relorb();
  box.append(mrow,el('div',{cls:'btnrow'},chaseBtn),orbitBox);
  /* seal: the order of ★ */
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'color:var(--golddim);font-size:13px'},'★ᵏ = ●  ·  k ？'));
  const entry=numberEntry(room,3,(v,clear)=>{
    if(Number(v)===inst.order) onWin();
    else { wrongSeal(chal); clear(); }
  });
  chal.append(entry.disp);
  room.append(bud,box,chal,entry.pad,entry.row);
};

/* --- K4 : hidden permutation puzzle. Learn what each lever does, then reach
       the deep target in the fewest presses. Seal: minimal press count. --- */
ROOM_UI.K4=(room,inst,onWin)=>{
  const N=inst.N, gens=inst.gens;
  const COLORS=['#7CE8FF','#D8B36A','#F04C3E','#7FA7F5','#B48CF5','#7FF58C'];
  let state=[...Array(N).keys()];
  let pressLog=[];
  const box=el('div',{cls:'labbox'});
  const tokRow=el('div',{});
  const drawTok=(arr,editable)=>{
    const row=el('div',{style:'display:flex;gap:6px'});
    arr.forEach((tok,pos)=>row.append(el('div',{style:`width:38px;height:38px;border-radius:6px;background:${COLORS[tok]};
      display:flex;align-items:center;justify-content:center;font-size:14px;color:#04060C;font-weight:bold`},String(tok+1))));
    return row;
  };
  const draw=()=>{ tokRow.innerHTML=''; tokRow.append(drawTok(state)); 
    plog.textContent = 'presses: '+pressLog.length+'   ['+pressLog.map(g=>g+1).join(' ')+']';
    matchLbl.textContent = state.join(',')===inst.target.join(',') ? '✓' : '';
    matchLbl.style.color='var(--gold)';
  };
  const levers=el('div',{style:'display:flex;gap:12px;justify-content:center'});
  [0,1,2].forEach(gi=>{
    levers.append(el('button',{cls:'key',style:'width:auto;padding:10px 18px;height:auto',onclick:()=>{
      AU.probe(); state=permApply(state,gens[gi]); pressLog.push(gi); draw();
    }},String(gi+1)));
  });
  const plog=el('div',{style:'font-size:13px;color:var(--phosdim)'},'');
  const matchLbl=el('div',{style:'font-size:14px'},'');
  const rst=resetBtn(()=>{ state=[...Array(N).keys()]; pressLog=[]; draw(); });
  draw();
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},''),tokRow,levers,
    el('div',{cls:'btnrow'},rst),plog,matchLbl);
  /* the target */
  const tgtBox=el('div',{cls:'sealbox'});
  tgtBox.append(el('div',{style:'color:var(--golddim);font-size:13px'},''),
    drawTok(inst.target));
  tgtBox.append(el('div',{style:'color:var(--phosdim);font-size:13px;margin-top:8px'},''));
  const entry=numberEntry(room,2,(v,clear)=>{
    /* must both name the god-number AND currently stand on the target
       via a sequence of that length */
    if(Number(v)===inst.minMoves && state.join(',')===inst.target.join(',') && pressLog.length===inst.minMoves) onWin();
    else { wrongSeal(tgtBox); clear(); }
  });
  tgtBox.append(entry.disp);
  room.append(box,tgtBox,entry.pad,entry.row);
};

/* --- K5 : hidden graph isomorphism. Recover the vertex correspondence
       between two rigid drawings. --- */
ROOM_UI.K5=(room,inst,onWin)=>{
  const N=inst.N;
  const drawGraph=(adj,labels,color,onNode)=>{
    const R=95,cx=120,cy=120;
    const node=k=>{ const a=(k/N*360-90)*Math.PI/180; return [cx+R*Math.cos(a),cy+R*Math.sin(a)]; };
    const svg=el('svg',{width:240,height:240,viewBox:'0 0 240 240'});
    for(let a=0;a<N;a++) for(let b=a+1;b<N;b++) if(adj[a][b]){
      const [x1,y1]=node(a),[x2,y2]=node(b);
      svg.append(el('line',{x1,y1,x2,y2,stroke:'var(--line2)','stroke-width':1.4}));
    }
    for(let k=0;k<N;k++){ const [x,y]=node(k);
      const g=el('g',{style:onNode?'cursor:pointer':'', onclick:onNode?()=>onNode(k):null});
      g.append(el('circle',{cx:x,cy:y,r:14,fill:'var(--stone)',stroke:color(k),'stroke-width':2}));
      g.append(el('text',{x,y:y+4,fill:color(k),'font-size':13,'text-anchor':'middle','pointer-events':'none'},labels(k)));
      svg.append(g);
    }
    return svg;
  };
  /* mapping[aVertex] = bVertex (or -1) */
  const mapping=new Array(N).fill(-1);
  let selA=-1;
  const PAL=['#7CE8FF','#D8B36A','#F04C3E','#7FA7F5','#B48CF5','#7FF58C','#F5E77F','#F57FB8','#E8E2D2'];
  const wrap=el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;justify-content:center'});
  const redraw=()=>{
    wrap.innerHTML='';
    const gA=drawGraph(inst.adjA,
      k=>String.fromCharCode(65+k),
      k=>selA===k?'var(--phos)':(mapping[k]>=0?PAL[k]:'var(--phosdim)'),
      k=>{ AU.tick(); selA=k; redraw(); });
    const gB=drawGraph(inst.adjB,
      k=>{ const src=mapping.indexOf(k); return src>=0?String.fromCharCode(65+src):'·'; },
      k=>{ const src=mapping.indexOf(k); return src>=0?PAL[src]:'var(--phosdim)'; },
      k=>{ if(selA<0){bad(wrap);return;} AU.tick();
        /* clear any previous target of selA and any source pointing to k */
        const prev=mapping.indexOf(k); if(prev>=0) mapping[prev]=-1;
        mapping[selA]=k; selA=-1; redraw(); });
    wrap.append(
      el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:4px'},
        el('div',{style:'color:var(--phosdim);font-size:12px'},'α'),gA),
      el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:4px'},
        el('div',{style:'color:var(--golddim);font-size:12px'},'β'),gB));
  };
  redraw();
  const hint=el('div',{style:'color:var(--phosdim);font-size:13px'},'α → β');
  room.append(hint,wrap,el('div',{cls:'btnrow'},
    resetBtn(()=>{mapping.fill(-1);selA=-1;redraw();}),
    submitBtn(()=>{
      if(mapping.some(v=>v<0)){ bad(wrap); return; }
      if(isoCheck(N,inst.adjA,inst.adjB,mapping)) onWin();
      else wrongSeal(wrap);
    })));
};

/* ================================================================
   ROOM UI — the abyss (A1..A3)
   ================================================================ */
const moDisp = v => v<0 ? '∞' : String(v);
const MO_SYM = [...Array(MO_P).keys(), -1];      /* 0..10, ∞ */

/* --- A1 : projective dynamics. Six budgeted evaluations of a hidden
       Möbius map on P¹(F₁₁); the orbit outruns the budget; the seal
       asks iterates N, N+1, N+2 for N ≈ 10¹². --- */
ROOM_UI.A1=(room,inst,onWin)=>{
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},
    'ƒ(x) = (ax+b)／(cx+d)　mod 11　·　P¹ ∋ ∞'));
  let xi=0;   /* index into MO_SYM */
  const xd=el('div',{style:'width:52px;height:40px;border:1px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--phos)'},'0');

  box.append(el('div',{style:'display:flex;gap:8px;align-items:center'},

    probeBtn(()=>{
      if(used>=tot){ bad(box); return; }
      used++; updBudget(bud,used,tot);
      AU.probe(); const y=moApply(inst.m,MO_SYM[xi]);
      out.textContent=moDisp(y);
      log.unshift([MO_SYM[xi],y]); if(log.length>8)log.pop(); relog();

    submitBtn(()=>{

/* --- A2 : the golden duel. Take from one heap, or equally from both;
       the last stone wins. The castle answers optimally — the Beatty
       invariant must be held to the very end. --- */
ROOM_UI.A2=(room,inst,onWin)=>{
  const cold=inst.cold;
  const rng=mulberry32((Date.now()^0xA55A)>>>0);
  let n=inst.n0, m=inst.m0, turn='you', linked=false;
  let selA=0, selB=0;
  const box=el('div',{cls:'labbox'});
  const info=el('div',{style:'color:var(--phosdim);font-size:14px;min-height:20px'},'');
  const board=el('div',{style:'display:flex;gap:34px;align-items:flex-end;justify-content:center'});
  const draw=()=>{
    board.innerHTML='';
    [[n,selA,0],[m,selB,1]].forEach(([p,sel,pi])=>{
      const col=el('div',{style:'display:flex;flex-direction:column-reverse;gap:3px;align-items:center;cursor:pointer;min-width:34px'});
      for(let s=0;s<p;s++){
        const taken = s>=p-sel;
        col.append(el('div',{style:`width:30px;height:12px;background:${taken?'var(--seal)':'var(--ember)'};
          opacity:${taken?.5:.92};border-radius:2px`}));
      }
      col.addEventListener('click',()=>{
        if(turn!=='you')return; AU.tick();
        if(linked){
          const mx=Math.min(n,m); if(mx<1) return;
          const k = (selA===selB&&selA>0) ? (selA>=mx?1:selA+1) : 1;
          selA=k; selB=k;
        } else if(pi===0){ selB=0; selA = selA>=n?1:selA+1; }
        else { selA=0; selB = selB>=m?1:selB+1; }
        draw();
      });
      const wrap=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:6px'});
      wrap.append(col,el('div',{style:'font-size:14px;color:var(--phosdim)'},String(p)));
      board.append(wrap);
    });
  };
  const linkBtn=el('button',{cls:'key',style:'width:52px;height:40px;font-size:18px',onclick:()=>{
    AU.blip(); linked=!linked; selA=0; selB=0;
    linkBtn.style.borderColor=linked?'var(--ember)':'var(--line)';
    linkBtn.style.color=linked?'var(--ember)':'var(--ink)';
    draw();
  }},'∥');
  const doReset=()=>{ n=inst.n0; m=inst.m0; selA=0; selB=0; turn='you'; info.textContent=''; draw(); };
  const takeBtn=submitBtn(()=>{
    if(turn!=='you'){ bad(box); return; }
    const one=(selA>0)!==(selB>0), both=(selA>0&&selA===selB&&selA<=Math.min(n,m));
    if(!one&&!both){ bad(box); return; }
    n-=selA; m-=selB; selA=0; selB=0; AU.blip();
    if(n===0&&m===0){ draw(); onWin(); return; }
    turn='castle'; draw(); info.textContent='…';
    setTimeout(()=>{
      if(S.view!=='A2') return;
      const rep=wyAiReply(n,m,cold,rng);
      if(rep){ n=rep[0]; m=rep[1]; }
      AU.probe();
      if(n===0&&m===0){ draw(); info.textContent='✕'; wrongSeal(box); return; }
      turn='you'; draw(); info.textContent='';
    },900);
  });
  draw();
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},'▮▮ − k　·　▮▮ − (k,k)　·　◆ ⟶ ○'),
    info,board,el('div',{cls:'btnrow'},resetBtn(doReset),linkBtn,takeBtn));
  room.append(box);
};

/* --- N1 : the index chamber. probes compute gᵏ mod p for a hidden
       base g; the seal shows y and demands x with gˣ ≡ y — the
       one-way wall itself. --- */
ROOM_UI.N1=(room,inst,onWin)=>{
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},
    'ｇᵏ　mod '+inst.p+'　·　ｇ ？'));
  let kbuf='';
  const kd=el('div',{style:'min-width:96px;height:40px;border-bottom:2px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--phos)'},'·');
  const out=el('div',{style:'font-size:24px;color:var(--gold);min-width:64px;text-align:center'},'·');
  const logB=el('div',{cls:'logbox'});
  const log=[];
  const relog=()=>{ logB.innerHTML=''; log.forEach(([k,y])=>logB.append(
    el('div',{style:'font-size:15px;color:var(--ink)'},`ｇ^${k} = ${y}`))); };
  const kpad=digitPad(d=>{ if(kbuf.length<4){kbuf+=d;kd.textContent=kbuf;} },
    ()=>{ kbuf=kbuf.slice(0,-1); kd.textContent=kbuf||'·'; });
  box.append(el('div',{style:'display:flex;gap:12px;align-items:center'},kd,
    el('div',{style:'color:var(--line)'},'→'),out,
    probeBtn(()=>{
      if(used>=tot||kbuf===''){ bad(box); return; }
      used++; updBudget(bud,used,tot);
      AU.probe();
      const k=Number(kbuf);
      const y=modpow(inst.g,k,inst.p);
      out.textContent=String(y);
      log.unshift([k,y]); if(log.length>8)log.pop(); relog();
      kbuf=''; kd.textContent='·';
    })),
    kpad,logB);
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'display:flex;gap:8px;align-items:center'},
    el('div',{style:'color:var(--golddim);font-size:22px'},'ｇ'),
    el('div',{style:'color:var(--phos);font-size:16px;transform:translateY(-8px)'},'？'),
    el('div',{style:'color:var(--golddim);font-size:20px'},'='),
    el('div',{style:'min-width:76px;height:44px;border:1px solid var(--golddim);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);padding:0 10px'},String(inst.y))));
  const entry=numberEntry(room,4,(v)=>{
    if(modpow(inst.g,Number(v),inst.p)===inst.y) onWin();
    else wrongSeal(chal);
  });
  chal.append(entry.disp);
  room.append(bud,box,chal,entry.pad,entry.row);
};

/* --- N2 : the hyperbolic chamber. Q(x,y)=x²−D·y² with D hidden;
       probes evaluate Q on small pairs; the seal demands the
       fundamental point of Q = 1 — Lagrange's continued fraction
       of √D, or nothing. --- */
ROOM_UI.N2=(room,inst,onWin)=>{

    const r=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:3px'},

  const relog=()=>{ logB.innerHTML=''; log.forEach(([a,b,v])=>logB.append(

  for(let i=0;i<2;i++){
    const d=el('div',{style:'min-width:88px;height:44px;border-bottom:2px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);cursor:pointer'},'·');
    d.addEventListener('click',()=>{ AU.tick(); active=i; paint(); });
    slotEls.push(d); slotWrap.append(d);
    if(i===0) slotWrap.append(el('div',{style:'color:var(--golddim)'},','));
  }
  slotWrap.append(el('div',{style:'color:var(--golddim);font-size:20px'},')'));
  const paint=()=>{ slotEls.forEach((d,i)=>{
    d.textContent=bufs[i]||'·';
    d.style.borderColor = i===active?'var(--gold)':'var(--phosdim)';
  }); };
  paint();
  chal.append(slotWrap);
  const pad=digitPad(d=>{ if(bufs[active].length<5){ bufs[active]+=d; if(bufs[active].length===5&&active===0)active=1; paint(); } },

  room.append(bud,box,chal,pad,el('div',{cls:'btnrow'},

      if(bufs[0]===''||bufs[1]===''){ bad(chal); return; }
      const X=Number(bufs[0]), Y=Number(bufs[1]);
      if(Y>=1&&X*X-inst.D*Y*Y===1) onWin();

};

/* --- N3 : the whorl chamber. the wall bears the Burrows–Wheeler
       transform of a hidden word (⊙ = end-mark, sorting first).
       the bench transforms words of your own making; the seal
       demands the hidden word back — the LF inversion, by hand. --- */
const N3_COLS=[...TRI_COL,'#E8E2FF'];
ROOM_UI.N3=(room,inst,onWin)=>{
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},'⟳⧉'));
  /* compose a word; probe returns its transform */
  const comp=[];
  const compW=el('div',{style:'display:flex;gap:3px;min-height:22px;flex-wrap:wrap;justify-content:center'});
  const outW=el('div',{style:'display:flex;gap:3px;min-height:22px;flex-wrap:wrap;justify-content:center'});
  const dcomp=()=>{ compW.innerHTML='';
    if(!comp.length){ compW.append(el('div',{style:'color:var(--line);font-size:15px'},'·')); return; }
    compW.append(triStrip(comp,20,N3_COLS)); };
  dcomp();
  const palB=el('div',{style:'display:flex;gap:8px;justify-content:center'});
  [0,1,2].forEach(c=>palB.append(el('button',{cls:'key',
    style:`width:48px;height:40px;background:${TRI_COL[c]};border-color:var(--line2)`,
    onclick:()=>{ if(comp.length<inst.cap){AU.tick();comp.push(c);dcomp();} }},'')));
  palB.append(el('button',{cls:'key',style:'width:48px;height:40px',
    onclick:()=>{AU.tick();comp.pop();dcomp();}},'⌫'));
  box.append(compW,palB,
    el('div',{cls:'btnrow'},probeBtn(()=>{
      if(used>=tot||comp.length<2){ bad(box); return; }
      used++; updBudget(bud,used,tot);
      AU.probe();
      outW.innerHTML=''; outW.append(triStrip(bwtOf(comp),20,N3_COLS));
    })),
    outW);
  /* seal: the great whorl, and the word behind it */
  const chal=el('div',{cls:'sealbox'});
  chal.append(triStrip(inst.bwt,22,N3_COLS),
    el('div',{style:'color:var(--phosdim);font-size:13px'},'⤳ ？'));
  const guess=[];
  const gw=el('div',{style:'display:flex;gap:3px;flex-wrap:wrap;justify-content:center'});
  const dg=()=>{ gw.innerHTML='';
    for(let i=0;i<inst.L;i++){
      const v=guess[i];
      gw.append(el('div',{style:`width:24px;height:24px;border:1px solid ${i===guess.length?'var(--gold)':'var(--line2)'};background:${v==null?'var(--stone)':N3_COLS[v]};border-radius:2px`}));
    }
  };
  dg();
  chal.append(gw);
  const pal=el('div',{style:'display:flex;gap:10px;justify-content:center'});
  [0,1,2].forEach(c=>pal.append(el('button',{cls:'key',
    style:`width:54px;height:44px;background:${TRI_COL[c]};border-color:var(--line2)`,
    onclick:()=>{ if(guess.length<inst.L){AU.tick();guess.push(c);dg();} }},'')));
  pal.append(el('button',{cls:'key',style:'width:54px;height:44px',
    onclick:()=>{AU.tick();guess.pop();dg();}},'⌫'));
  room.append(bud,box,chal,pal,el('div',{cls:'btnrow'},
    resetBtn(()=>{guess.length=0;dg();}),
    submitBtn(()=>{
      if(guess.length!==inst.L){ bad(chal); return; }
      if(guess.every((v,i)=>v===inst.word[i])) onWin();
      else wrongSeal(chal);
    })));
};

/* --- N4 : the lattice chamber. probes reveal u·b₁+v·b₂ for hidden
       skewed b₁,b₂ ∈ ℤ²; the seal demands the shortest nonzero
       vector of the lattice — Lagrange–Gauss reduction, the germ
       of LLL. --- */
ROOM_UI.N4=(room,inst,onWin)=>{
  let used=0; const tot=inst.bud;
  const bud=budgetChip(used,tot);
  const box=el('div',{cls:'labbox'});
  box.append(el('div',{style:'color:var(--phosdim);font-size:13px'},'u·𝐛₁ ＋ v·𝐛₂　·　𝐛 ？'));
  let pu=0, pv=0;
  const out=el('div',{style:'font-size:22px;color:var(--gold);min-width:110px;text-align:center'},'·');
  const mk=(get,set)=>{
    const d=el('div',{style:'width:44px;height:40px;border:1px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--phos)'},String(get()));
    const r=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:3px'},
      el('button',{cls:'key',style:'width:36px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(1);d.textContent=get();out.textContent='·';}},'＋'),
      d,
      el('button',{cls:'key',style:'width:36px;height:22px;font-size:12px',onclick:()=>{AU.tick();set(-1);d.textContent=get();out.textContent='·';}},'−'));
    return r;
  };
  const logB=el('div',{cls:'logbox'});
  const log=[];
  const relog=()=>{ logB.innerHTML=''; log.forEach(([u,v,x,y])=>logB.append(
    el('div',{style:'font-size:15px;color:var(--ink)'},`${u}·𝐛₁＋${v}·𝐛₂ = ( ${x} , ${y} )`))); };
  box.append(el('div',{style:'display:flex;gap:10px;align-items:center'},
    mk(()=>pu,d=>pu=Math.max(-9,Math.min(9,pu+d))),
    el('div',{style:'color:var(--line)'},','),
    mk(()=>pv,d=>pv=Math.max(-9,Math.min(9,pv+d))),
    el('div',{style:'color:var(--line)'},'→'),out,
    probeBtn(()=>{
      if(used>=tot){ bad(box); return; }
      used++; updBudget(bud,used,tot);
      AU.probe();
      const x=pu*inst.b1[0]+pv*inst.b2[0], y=pu*inst.b1[1]+pv*inst.b2[1];
      out.textContent=`( ${x} , ${y} )`;
      log.unshift([pu,pv,x,y]); if(log.length>8)log.pop(); relog();
    })));
  box.append(logB);
  /* seal: the shortest nonzero vector, in coordinates */
  const chal=el('div',{cls:'sealbox'});
  chal.append(el('div',{style:'display:flex;gap:8px;align-items:center;color:var(--golddim);font-size:19px'},
    el('div',{},'‖ · ‖'),
    el('svg',{width:20,height:20,viewBox:'0 0 20 20'},
      el('path',{d:'M10 3 V15 M5 11 L10 16 L15 11',fill:'none',stroke:'currentColor','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round'})),
    el('div',{style:'color:var(--phos)'},'≠ 𝟎')));
  const vals=[null,null], signs=[1,1];
  let active=0;
  const slotEls=[];
  const slotWrap=el('div',{style:'display:flex;gap:8px;align-items:center'});
  slotWrap.append(el('div',{style:'color:var(--golddim);font-size:20px'},'('));
  for(let i=0;i<2;i++){
    const d=el('div',{style:'min-width:64px;height:44px;border-bottom:2px solid var(--phosdim);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);cursor:pointer'},'·');
    d.addEventListener('click',()=>{ AU.tick(); active=i; paint(); });
    slotEls.push(d); slotWrap.append(d);
    if(i===0) slotWrap.append(el('div',{style:'color:var(--golddim)'},','));
  }
  slotWrap.append(el('div',{style:'color:var(--golddim);font-size:20px'},')'));
  const paint=()=>{ slotEls.forEach((d,i)=>{
    d.textContent = vals[i]===null?'·':((signs[i]<0?'−':'')+vals[i]);
    d.style.borderColor = i===active?'var(--gold)':'var(--phosdim)';
  }); };
  paint();
  chal.append(slotWrap);
  const pad=el('div',{cls:'keypad',style:'grid-template-columns:repeat(6,var(--keyw,54px))'});
  '1234567890'.split('').forEach(dg=>pad.append(el('button',{cls:'key',onclick:()=>{
    AU.tick(); vals[active]=Number(dg); if(active<1)active=1; paint();
  }},dg)));
  pad.append(el('button',{cls:'key',onclick:()=>{ AU.tick(); signs[active]*=-1; paint(); }},'±'));
  pad.append(el('button',{cls:'key',onclick:()=>{ AU.tick(); vals[active]=null; signs[active]=1; paint(); }},'⌫'));
  room.append(bud,box,chal,pad,el('div',{cls:'btnrow'},
    resetBtn(()=>{ vals[0]=vals[1]=null; signs[0]=signs[1]=1; active=0; paint(); }),
    submitBtn(()=>{
      if(vals[0]===null||vals[1]===null){ bad(chal); return; }
      const x=signs[0]*vals[0], y=signs[1]*vals[1];
      const s=inst.sv;
      if((x===s[0]&&y===s[1])||(x===-s[0]&&y===-s[1])) onWin();
      else wrongSeal(chal);
    })));
};

/* --- OM : the singularity. one composite number is the heart of
       everything; the seal demands its two prime names. its flaw:
       the primes were forged too close — the difference of squares
       splits what trial division cannot. --- */
ROOM_UI.OM=(room,inst,onWin)=>{
  const box=el('div',{cls:'sealbox',style:'border-color:var(--singdim)'});
  box.append(el('div',{style:'font-size:40px;letter-spacing:6px;color:var(--sing);text-shadow:0 0 22px rgba(232,226,255,.5)'},
    String(inst.n)),
    el('div',{style:'color:var(--singdim);font-size:14px'},'＝ ？ ✕ ？'));
  const bufs=['',''];
  let active=0;
  const slotEls=[];
  const slotWrap=el('div',{style:'display:flex;gap:10px;align-items:center'});
  for(let i=0;i<2;i++){
    const d=el('div',{style:'min-width:76px;height:48px;border-bottom:2px solid var(--singdim);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--sing);cursor:pointer'},'·');

    slotEls.push(d); slotWrap.append(d);

    d.textContent=bufs[i]||'·';

  }); };
  paint();
  box.append(slotWrap);

    ()=>{ bufs[active]=bufs[active].slice(0,-1); paint(); });
  room.append(box,pad,el('div',{cls:'btnrow'},
    resetBtn(()=>{ bufs[0]=bufs[1]=''; active=0; paint(); }),
    submitBtn(()=>{
      if(bufs[0]===''||bufs[1]===''){ bad(box); return; }
      const a=Number(bufs[0]), b=Number(bufs[1]);
      if((a===inst.p&&b===inst.q)||(a===inst.q&&b===inst.p)) onWin();
      else wrongSeal(box);
    })));
};

/* --- GC : the five-gear finale. Each gear is driven by one carved datum;
       align them by the Chinese-remainder key. --- */
function gearSvg(teeth, val, mod, highlight){
  const R=52, cx=64, cy=64;
  const svg=el('svg',{width:128,height:128,viewBox:'0 0 128 128'});
  const g=el('g',{style:`transform-origin:${cx}px ${cy}px;transition:transform .6s cubic-bezier(.4,0,.2,1)`});
  g.setAttribute('transform',`rotate(${val/mod*360})`);
  for(let k=0;k<teeth;k++){
    const a=k/teeth*2*Math.PI;
    const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    g.append(el('rect',{x:x-4,y:y-7,width:8,height:14,transform:`rotate(${k/teeth*360} ${x} ${y})`,
      fill:highlight?'var(--gold)':'var(--phosdim)'}));
  }
  g.append(el('circle',{cx,cy,r:R-8,fill:'var(--stone2)',stroke:highlight?'var(--gold)':'var(--phosdim)','stroke-width':2}));
  g.append(el('circle',{cx,cy,r:8,fill:'var(--void)',stroke:highlight?'var(--gold)':'var(--phosdim)','stroke-width':1.6}));
  /* pointer */
  g.append(el('line',{x1:cx,y1:cy,x2:cx,y2:cy-(R-14),stroke:highlight?'var(--gold)':'var(--phos)','stroke-width':2.4}));
  svg.append(g);
  svg.append(el('text',{x:cx,y:cy+R+16,fill:'var(--phosdim)','font-size':13,'text-anchor':'middle'},'mod '+mod));
  return {svg, setVal:v=>{ g.setAttribute('transform',`rotate(${v/mod*360})`); }};
}
GATE_UI.GC=(room,onOpen)=>{

  const cvals=[carved.B2,carved.B6,carved.K1,carved.K3,carved.K5];
  gateShell(room,'var(--gold)');

  const gears=[];
  const carveIcons=['B2','B6','K1','K3','K5'];
  inst.mods.forEach((m,i)=>{
    const wrap=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:2px'});
    const tgt=cvals[i]%m;
    const gr=gearSvg(m+ (m%2), 0, m, false);
    gears.push({gr,mod:m,tgt});
    wrap.append(el('div',{style:'color:var(--phosdim);font-size:12px;display:flex;gap:4px;align-items:center'},
      (()=>{const s=el('svg',{width:18,height:18,viewBox:'0 0 26 26'});const g=el('g',{style:'color:var(--golddim)'});(ICONS[carveIcons[i]]||(()=>{}))(g);s.append(g);return s;})(),
      el('span',{},'≡ ?')));
    wrap.append(gr.svg);
    gearRow.append(wrap);
  });
  /* the master key: a single dial X in [0, M). Turning it sets each gear to X mod m_i. */
  let X=0;
  const M=inst.M;
  const keyDisp=el('div',{style:'font-size:30px;letter-spacing:3px;color:var(--gold);min-width:200px;text-align:center;border-bottom:2px solid var(--golddim);padding:6px'},'0');
  const readout=el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px'});
  const updateGears=()=>{
    keyDisp.textContent=String(X);
    readout.innerHTML='';
    gears.forEach(g=>{
      const r=((X%g.mod)+g.mod)%g.mod;
      g.gr.setVal(r);
      const ok=false;   /* no per-gear confirmation: residues come from the carved data */
      readout.append(el('div',{style:`padding:3px 8px;border:1px solid ${ok?'var(--gold)':'var(--line2)'};
        color:${ok?'var(--gold)':'var(--phosdim)'}`}, r+(ok?' ✓':'')));
    });
  };
  updateGears();
  /* controls: fine +/- and coarse, plus a digit pad */
  let buf='';
  const setX=v=>{ X=((v%M)+M)%M; buf=''; updateGears(); };
  const nudge=d=>{ X=((X+d)%M+M)%M; AU.tick(); updateGears(); };
  const ctl=el('div',{cls:'btnrow'});
  ctl.append(
    el('button',{cls:'key',style:'width:auto;padding:8px 14px',onclick:()=>nudge(-100)},'−100'),
    el('button',{cls:'key',style:'width:auto;padding:8px 14px',onclick:()=>nudge(-1)},'−1'),
    el('button',{cls:'key',style:'width:auto;padding:8px 14px',onclick:()=>nudge(1)},'＋1'),
    el('button',{cls:'key',style:'width:auto;padding:8px 14px',onclick:()=>nudge(100)},'＋100'));
  const pad=digitPad(d=>{ if(buf.length<6){buf+=d; keyDisp.textContent=buf;} },
    ()=>{buf=buf.slice(0,-1);keyDisp.textContent=buf||'0';},5);
  const padRow=el('div',{cls:'btnrow'},
    el('button',{cls:'key',style:'width:auto;padding:8px 16px',onclick:()=>{ if(buf!==''){AU.blip();setX(Number(buf));} }},'⊙'),
    resetBtn(()=>setX(0)));
  const sealRow=el('div',{cls:'btnrow'},submitBtn(()=>{
    const good = gears.every(g=>(((X%g.mod)+g.mod)%g.mod)===g.tgt);
    if(good && X===inst.X) onOpen();
    else if(good) onOpen(); /* any X satisfying all residues equals inst.X by CRT */
    else wrongSeal(readout);
  }));
  room.append(gearRow,keyDisp,readout,ctl,pad,padRow,sealRow);
};
/* ================================================================
   TITLE — an emblem of the octagonal castle over a hidden lattice
   ================================================================ */
function emblemSvg(){
  const svg=el('svg',{width:200,height:200,viewBox:'0 0 200 200'});
  const cx=100,cy=100;
  const oct=r=>{const p=[];for(let k=0;k<8;k++){const a=(k*45+22.5-90)*Math.PI/180;
    p.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);}return p.join(' ');};
  svg.append(el('polygon',{points:oct(88),fill:'none',stroke:'var(--golddim)','stroke-width':1.5}));
  svg.append(el('polygon',{points:oct(66),fill:'none',stroke:'var(--golddim)','stroke-width':1.2,opacity:.7}));
  svg.append(el('polygon',{points:oct(44),fill:'none',stroke:'var(--golddim)','stroke-width':1.1,opacity:.5}));
  /* radial spokes */
  for(let k=0;k<8;k++){ const a=(k*45+22.5-90)*Math.PI/180;
    svg.append(el('line',{x1:cx,y1:cy,x2:cx+88*Math.cos(a),y2:cy+88*Math.sin(a),
      stroke:'var(--golddim)','stroke-width':0.6,opacity:.4})); }
  /* the seal-diamond core */
  svg.append(el('polygon',{points:`${cx},${cy-26} ${cx+26},${cy} ${cx},${cy+26} ${cx-26},${cy}`,
    fill:'none',stroke:'var(--gold)','stroke-width':2,cls:'breathe'}));
  svg.append(el('circle',{cx,cy,r:6,fill:'var(--gold)'}));
  /* orbiting glyph-nodes */
  const glyphs=['W1','B4','K3','W6','K5'];
  glyphs.forEach((id,i)=>{ const a=(i/glyphs.length*360-90)*Math.PI/180;
    const gx=cx+66*Math.cos(a), gy=cy+66*Math.sin(a);
    const g=el('g',{transform:`translate(${gx-13},${gy-13})`,style:'color:var(--golddim)'});
    (ICONS[id]||(()=>{}))(g); svg.append(g); });
  return svg;
}
function fillEmblem(em){
  const c=115;
  [96,72,50,30].forEach((r,i)=>{
    const pts=[];
    for(let k=0;k<8;k++){const a=(k*45+22.5-90)*Math.PI/180;pts.push(`${c+r*Math.cos(a)},${c+r*Math.sin(a)}`);}
    const poly=el('polygon',{points:pts.join(' '),fill:'none',
      stroke:(i===1||i===2)?'var(--golddim)':'var(--line)','stroke-width':i===3?1.6:1.1,
      cls:i===0?'breathe':''});
    GEO.draw(poly,1.15,.1+i*.26);
    em.append(poly);
  });
  for(let k=0;k<8;k++){ const a=(k*45+22.5-90)*Math.PI/180;
    const sp=el('line',{x1:c,y1:c,x2:c+96*Math.cos(a),y2:c+96*Math.sin(a),
      stroke:'var(--golddim)','stroke-width':0.5,opacity:.35});
    GEO.draw(sp,.6,1.1+k*.05);

  for(const r of [96,72,50]){
    for(const dx of [-7,7]){

    fill:'none',stroke:'var(--gold)','stroke-width':2});
  GEO.draw(od,.9,1.85);
  em.append(od);
  const core=el('polygon',{points:`${c},${c-7} ${c+7},${c} ${c},${c+7} ${c-7},${c}`,

  GEO.once(core,'opacity','0;.9',.7,2.15,'0;1');

  em.append(core);
  /* a lone surveyor circles the finished seal */
  em.append(GEO.orbit(c,c,104,26,1.6,{fill:'var(--gold)',opacity:.8},1,-90));
}

  /* inner octagon framing the emblem */

  GEO.draw(o1,1.6,.15); const og=el('g'); og.append(o1); GEO.rot(og,90,1,c,c); svg.append(og);

  function secretCrack(base,p,amt){

  /* ---------- tileset ---------- */
  const cache={};
  function tileset(key){
    if(cache[key]) return cache[key];
    const p=PAL[key], seed=({ward:11,bailey:23,keep:37,abyss:51,nadir:67})[key];
    const body={ward:brickWall,bailey:brickWall,keep:slabWall,abyss:basaltWall,nadir:crystalWall}[key];
    const fr={ward:'diamond',bailey:'tri',keep:'star',abyss:'tri',nadir:'lattice'}[key];
    const o={ward:{moss:'#7fd7e8',cracks:3},bailey:{moss:'#6fae5a',cracks:4,bh:9},keep:{},abyss:{},nadir:{}}[key];
    const A=body(p,seed,o), B=body(p,seed+100,Object.assign({},o,{cracks:(o.cracks||0)+2})), C=body(p,seed+200,o);
    const clone=P=>new Pix(64,64,P.d.slice());
    const walls=[null,tex(A),tex(B),tex(frieze(clone(C),p,fr))];
    walls[4]=tex(C);
    for(let i=0;i<6;i++) walls[5+i]=tex(mural(clone(A),i,p));
    walls[11]={w:64,h:64,frames:[tex(gateDoor(p,'locked')),tex(gateDoor(p,'ready')),tex(gateDoor(p,'open'))],sel:0};
    walls[11].d=walls[11].frames[0].d;
    walls[12]={w:64,h:64,frames:[tex(gateDoor(p,'locked'))],sel:0}; walls[12].d=walls[12].frames[0].d;
    const cr1=tex(secretCrack(A,p,.2)), cr2=tex(secretCrack(A,p,.9));
    walls[13]={w:64,h:64,frames:[tex(A),cr1,cr2],sel:0,anim:{rate:5,on:false}}; walls[13].d=walls[13].frames[0].d;
    walls[14]=tex(sealBars(p));
    const floors=[0,1,2,3,4,0,6,7,8,9,10].map((k,i)=>tex(floorTile(p,k,key,seed+i)));
    const ceils=[tex(ceilTile(p,0,key,seed+7)),tex(ceilTile(p,1,key,seed+8))];
    return cache[key]={key,pal:p,walls,floors,ceils,fog:p.fog,tint:p.tint,amb:p.amb,lampCol:hex(p.lamp)};
  }

        for(let y=ya;y<yb;y++,tp+=step){

          const bt=BAYT[((y&3)<<2)|(x&3)];
          const lev=(((c>>>24)===254?Le:Lf*ao)*15+bt)|0;
          let r=(((c&255)*MR[lev])>>8)+FR[lev], g=((((c>>>8)&255)*MG[lev])>>8)+FG[lev], b=((((c>>>16)&255)*MB[lev])>>8)+FB[lev];
          buf[y*W+x]=(0xFF000000|((b>255?255:b)<<16)|((g>255?255:g)<<8)|(r>255?255:r))>>>0; } }
      /* ---- sprites (far → near) ---- */
      const list=sprites.filter(s=>s&&s.tex).map(s=>({s,d:(s.x-px)*(s.x-px)+(s.y-py)*(s.y-py)})).sort((a,b)=>b.d-a.d);
      const inv=1/(plX*dirY-dirX*plY);
      for(const {s} of list){
        const sx=s.x-px, sy=s.y-py, tx=inv*(dirY*sx-dirX*sy), ty=inv*(-plY*sx+plX*sy);

        if(x1<x0) continue;

        let Ls=lamp(ty); if(nl) Ls=Math.min(1,Ls+lightAt(s.x,s.y)); if(s.minL&&Ls<s.minL) Ls=s.minL; const Le=Ls+.5>1?1:Ls+.5;

            const lev=((a===254||s.emis?Le:Ls)*15+BAYT[((y&3)<<2)|(x&3)])|0;

      for(let k=0;k<4;k++){ const nx=x+DX[k], ny=y+DY[k]; if(nx<0||ny<0||nx>=w||ny>=h) continue; const n=nx+ny*w;
        if(d[n]>=0||!ok(nx,ny)) continue; d[n]=d[c]+1; q.push(n); } }

/* ====================================================================
   MOB — the guardians.  every law of the castle given a body.
   they never speak: their gait, their eyes and the way they die
   are the whole of their language.  64×64 (bosses 96×96) pixel sprites,
   redrawn live so each creature breathes, glares, winds up and lunges.
   ==================================================================== */
const MOB=(()=>{
  const {pack,hex,mix,shade,emit,ramp,ramp5,Pix,WHITE,pick}=PX;
  const OL=hex('#06030a'), PI=Math.PI, TAU=PI*2, sin=Math.sin, cos=Math.cos, abs=Math.abs;
  const P5=b=>ramp5(hex(b)), AC=c=>emit(hex(c)), lerp=(a,b,t)=>a+(b-a)*t;
  /* eyes — mood is the whole dialogue */
  function eye(P,x,y,s,c,m,t){ const mood=(m&&m.mood)||'idle', tt=t||0;
    if(mood==='dormant'||mood==='dead'){ P.line(x-s,y,x+s,y,OL); return; }
    if(mood==='hurt'){ P.line(x-s,y-s,x+s,y+s,c); P.line(x-s,y+s,x+s,y-s,c); return; }
    if(tt%4.3>4.17){ P.line(x-s,y,x+s,y,c); return; }
    if(mood==='wind'||mood==='strike'||mood==='taunt'){ P.line(x-s,y-1,x+s,y+1,c); P.line(x-s,y,x+s,y+2,c); P.put(x+s*.4,y+1,WHITE); return; }

  function closeMemorial(){ if(S.view!=='memorial') return; L.mem.classList.add('hidden'); L.mem.innerHTML=''; S.view='dungeon'; if(st.world) st.world.lock=false; }
  function heartTouch(e){ st.busy=true; const w=st.world; w.lock=true; S.view='cut'; try{ AU.abyssal&&AU.abyssal(); }catch(_){} flash('rgba(255,120,120,.7)'); setTimeout(()=>{ CUT.play('end2',()=>{ showTrueEnding(); }); },700); }
  function engageEnt(e){ st.busy=true; const w=st.world; w.lock=true; try{ AU.encounter(); }catch(_){} L.cv.classList.add('zap'); flash('rgba(255,255,255,.5)');
    setTimeout(()=>{ L.cv.classList.remove('zap'); try{ BAT.begin(e); }catch(err){ console.error(err); } R.sync(); },520); }
  /* ---------- after-battle ---------- */
  R.battleEnd=(kind,id,bk)=>{ if(kind==='retreat') return afterRetreat(id); if(bk==='gate') gateOpen(id); else roomClear(id); };
  R.hideBattle=()=>{ BAT.hide(); R.sync(); };
  R.afterClear=(id)=>{ BAT.hide(); const w=st.world; const e=w.lv.ents.find(q=>q.id===id); if(e){ e.dead=true; if(e.kind==='mob') addStele(w.lv,id,e.hx,e.hy); }
    S.view='dungeon'; S.hp=Math.min(S.hpMax,S.hp+2); refreshHP(); try{ MUS.battle(false); }catch(_){}
    if(id==='OM'){ st.busy=true; S.view='cut'; CUT.play('end3',()=>{ showOmegaEnding(); }); return; }
    st.busy=false; w.lock=false; refreshDormant(); R.sync(); renderHud(); };
  R.afterGate=(id)=>{ BAT.hide(); const w=st.world; const e=w.lv.ents.find(q=>q.id===id); if(e) e.dead=true; openGate(w.lv); S.view='dungeon'; S.hp=Math.min(S.hpMax,S.hp+2); refreshHP(); try{ MUS.battle(false); }catch(_){}
    st.busy=false; w.lock=false; refreshDormant(); R.sync(); renderHud(); };
  function afterRetreat(id){ BAT.hide(); const w=st.world, lv=w.lv, e=lv.ents.find(q=>q.id===id); S.view='dungeon'; try{ MUS.battle(false); }catch(_){}
    if(e){ let best=null,bd=-1; const cells=[]; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) cells.push([w.cx+dx,w.cy+dy]);
      for(const [x,y] of cells){ if(!DUN.open(lv,x,y)||(x===e.cx&&y===e.cy)) continue; const d=Math.abs(x-e.cx)+Math.abs(y-e.cy); if(d>bd&&w.los(w.cx,w.cy,x,y)){ bd=d; best=[x,y]; } }
      if(best){ const f=Math.abs(e.cx-best[0])>=Math.abs(e.cy-best[1])?(e.cx>best[0]?3:1):(e.cy>best[1]?0:2); w.place(best[0],best[1],(f+2)%4); }
      e.stun=6; e.state='return'; e.mv=null; e.x=e.cx+.5; e.y=e.cy+.5; }
    st.busy=false; w.lock=false; refreshDormant(); R.sync(); renderHud(); }
  R.ending1=()=>{ st.busy=true; S.view='cut'; if(st.world) st.world.lock=true; CUT.play('end1',()=>{ showEnding(); }); };
  /* ---------- lifecycle ---------- */
  R.begin=()=>{ init(); S.view='cut'; st.busy=true; CUT.play('prologue',()=>{ loadFloor(0,'start'); }); };
  R.reset=()=>{ st.worlds=[]; st.world=null; st.busy=false; R._lastHp=null; S.floor=0; S.hp=S.hpMax; if(L){ BAT.hide(); L.world.classList.add('hidden'); L.mem.classList.add('hidden'); const stg=$('#stage'); if(stg) stg.classList.remove('hidden'); L.cv.classList.remove('zap'); } try{ MUS.stop(); }catch(_){} };
  R.frame=(dt)=>{ if(S.view==='title'&&L&&L.tpix){ st.tT=(st.tT||0)+dt; st.tA=(st.tA||0)-dt; if(st.tA<=0){ st.tA=.08; CUT.paint(L.tpix,st.tT,'title'); L.tctx.putImageData(L.timg,0,0); } return; }
    if(CUT.active) CUT.update(dt); else if(BAT.active) BAT.update(dt); else if(S.view==='dungeon'&&st.world){ st.world.update(dt); drawWorld(); st.sprT-=dt; if(st.sprT<=0){ st.sprT=.5; refreshDormant(); } } };
  function loop(ts){ const dt=Math.min(.05,((ts-st.last)/1000)||0); st.last=ts; try{ R.frame(dt); }catch(err){ console.error(err); } raf=requestAnimationFrame(loop); }
  R.start=()=>{ init(); if(!raf) raf=requestAnimationFrame(loop); };
  R.nova=(kind)=>{ if(!L) return; if(!L.fx){ L.fx=el('div',{id:'dfx'}); if(L.dwrap) L.dwrap.append(L.fx); }
    const n=el('div',{cls:'nova '+(kind||'seal')}); L.fx.append(n); setTimeout(()=>{ try{n.remove();}catch(_){} },1100);
    if(kind==='scar'&&L.cv){ L.cv.classList.remove('scar'); void L.cv.offsetWidth; L.cv.classList.add('scar'); }
    if(kind==='rift'&&L.dwrap){ L.dwrap.classList.remove('riftgo'); void L.dwrap.offsetWidth; L.dwrap.classList.add('riftgo'); } };
  R.refreshHP=refreshHP; R.flash=flash; R.state=st; R.floorOf=floorOf; R.loadFloor=loadFloor; R.openMemorial=openMemorial; R.closeMemorial=closeMemorial; R.init=init; R.act=act; R.knock=knock;
  R.onProbe=()=>{ try{ BAT.onProbe(); }catch(_){} }; R.onSeal=()=>{ try{ BAT.onSeal(); }catch(_){} };
  R.encounterById=(id)=>{ init(); let fi=FL.findIndex(f=>f.ids.includes(id)||f.boss===id); if(fi<0) return; if(S.floor!==fi||!st.world) loadFloor(fi,'start'); const e=st.world.lv.ents.find(q=>q.id===id); if(e){ st.busy=false; st.world.lock=false; S.view='dungeon'; engageEnt(e); } };
  return R;
})();

/* ================================================================
   BOOT
   ================================================================ */
function boot(){
  try{
    buildTitle();
    RPG.init(); RPG.start(); S.hp=S.hpMax; RPG.refreshHP();
    renderHud();
    window.__AC3 = { RPG, BAT, CUT, DUN, WLD, MOB, SCN, TEX, MUS, HERO, AU, FL:DUN.SPEC, isGateId, S, INST, GEN, ROOM_UI, GATE_UI, carvedOf, carvedAll,
      enterRoom, enterGate, showEnding, showTrueEnding, startGame, buildTitle,
      rngOf, buildWorld, resetToTitle, wrongSeal,
      descend, ascend,
      descendNadir, ascendNadir, showOmegaEnding, NADIR_IDS, collapseNow, gateReady,
      get SEED(){ return SEED; }, get WORLD(){ return WORLD; } };
  }catch(err){
    // surface any boot failure instead of leaving a dead screen
    const st=document.getElementById('stage')||document.body;
    if(st){ st.innerHTML='';
      const box=document.createElement('div');
      box.setAttribute('style','margin:auto;max-width:520px;padding:24px;color:#F04C3E;'+
        'font-family:monospace;font-size:14px;line-height:1.7;text-align:left;white-space:pre-wrap');
      box.textContent='⚠\n\n'+(err&&err.stack?err.stack:String(err));
      st.append(box);
    }
    try{ console.error('AC3 boot error',err); }catch(_){}
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
